<div class="page">
  <header class="header">
    <h1 class="title">AI Video Subtitler</h1>
    <p class="tagline">
      Upload a video or paste a YouTube link, pick your target language, and get an SRT subtitle file.
    </p>
    <app-theme-toggle />
  </header>

  <main class="card">
    <fieldset class="source-mode" aria-label="Video source mode">
      <label>
        <input type="radio" name="sourceMode" [checked]="sourceMode() === 'upload'"
          (change)="onSourceModeChange('upload')" />
        Upload file
      </label>
      <label>
        <input type="radio" name="sourceMode" [checked]="sourceMode() === 'youtube'"
          (change)="onSourceModeChange('youtube')" />
        YouTube URL
      </label>
    </fieldset>

    @if (sourceMode() === 'upload') {
    <app-drop-zone [(file)]="selectedFile" />
    } @else {
    <div class="youtube-input-wrap">
      <label for="youtubeUrl" class="youtube-label">YouTube link</label>
      <input id="youtubeUrl" class="youtube-input" type="url" [value]="youtubeUrl()"
        placeholder="https://www.youtube.com/watch?v=..." (input)="onYoutubeUrlChange($event)"
        [attr.aria-invalid]="youtubeUrlError() ? 'true' : null" />
      @if (youtubeUrlError()) {
      <p class="youtube-error">{{ youtubeUrlError() }}</p>
      }
    </div>
    }

    <app-language-controls [(sourceLanguage)]="sourceLanguage" [(targetLanguage)]="targetLanguage" />

    <label class="burn-option">
      <input type="checkbox" [checked]="burnSubtitles()" (change)="onBurnSubtitlesChange($event)" />
      Burn subtitles into the video
    </label>

    <button class="btn-primary" [disabled]="!canSubmit()" (click)="submit()">
      @if (isProcessing()) {
      <span class="spinner"></span> Processing&hellip;
      } @else {
      Generate Subtitles
      }
    </button>

    @if (errorMessage()) {
    <div class="alert alert-error">{{ errorMessage() }}</div>
    }

    @if (srtContent()) {
    <app-subtitle-result [srtContent]="srtContent()!" [detectedLanguage]="detectedLanguage()"
      [showVideoDownload]="burnSubtitles()" [videoDownloadUrl]="videoDownloadUrl()" [videoFileName]="videoFileName()"
      [videoPending]="isPreparingVideo()" />
    }
  </main>
</div>
