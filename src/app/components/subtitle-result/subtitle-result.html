<div class="result">
  <div class="result-header">
    <div>
      <h2>Subtitles ready!</h2>
      @if (detectedLanguage()) {
      <p class="detected">Detected source language: <strong>{{ detectedLanguageName }}</strong></p>
      }
    </div>
    <div class="result-actions">
      <button class="btn-download" (click)="download()">&#10515; Download .srt</button>
      @if (showVideoDownload()) {
      <button class="btn-download" [disabled]="videoPending() || !videoDownloadUrl()" (click)="downloadVideo()">
        @if (videoPending()) {
        Preparing video...
        } @else {
        &#10515; Download video
        }
      </button>
      }
    </div>
  </div>
  <pre class="srt-preview">{{ srtContent() }}</pre>
</div>
